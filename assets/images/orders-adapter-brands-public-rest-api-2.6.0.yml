              examples:
                example-1:
                  value:
                    id: 5020000000026145000
            application/xml:
              schema:
                type: object
                properties: {}
        '401':
          description: Unauthorized
      operationId: orderAddressInvoicing
      description: Get invoicing address for an order
      tags:
