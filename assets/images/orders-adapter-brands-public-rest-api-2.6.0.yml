openapi: 3.0.0
info:
  title: Orders Adapter Brands Public Rest API
  version: 2.6.0
  description: Operations for Orders Service Adapter REST API
  contact: {}
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://des-mecosoab-orders-{brand}.apps.axdesecocp1.ecommerce.inditex.grp
    description: DES
    variables:
      brand:
        enum:
          - bk
          - lf
          - md
          - oy
          - pb
          - st
          - ut
          - zh
          - global
        default: global
  - url: https://preint-apigw-swapi.{brand}.apps.axpreecocp2.ecommerce.inditex.grp
    description: PRE
    variables:
      brand:
        enum:
          - bk
          - lf
          - md
          - oy
          - pb
          - st
          - ut
          - zh
          - global
        default: global
  - url: https://apigw-swapi.{brand}.apps.ieec1ocp1.ecommerce.inditex.grp
    description: PRO
    variables:
      brand:
        enum:
          - bk
          - lf
          - md
          - oy
          - pb
          - st
          - ut
          - zh
          - global
        default: global
security:
  - {}
paths:
  /itxrest/3/order/store/{storeId}/order/{orderId}/tracking:
    parameters:
      - $ref: '#/components/parameters/storeId'
      - $ref: '#/components/parameters/orderId'
    get:
      summary: Get information about an order tracking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
              examples:
                example-1:
                  value:
                    id: 80001546807
                    status: G
                    statusText: En trámite
                    placeDate: '2021-05-10T13:35:14.512Z'
                    placeDateUTC: '2021-05-10T13:35:14.512Z'
                    lastUpdate: '2021-05-10T13:35:14.512Z'
                    lastUpdateUTC: '2021-05-10T13:35:14.512Z'
                    subordersNumber: 1
                    orderDelivery:
                      - id: '237209400'
                        fechaEstimada: '2021-07-08 15:12:00.000Z'
                        fechaEstimadaUTC: '2021-07-08T13:12:00.000Z'
                        courier: ASM_GLS
                        statusSuborder: K
                        statusSuborderText: Entregado
                        shippingInfo:
                          name: Entrega a domicilio
                          kind: delivery
                          shippingMethodId: 22855
                          shippingData:
                            addressId: '5020000000101204000'
                            physicalStoreId: '2882'
                        statusTracking:
                          - subStatus: '103'
