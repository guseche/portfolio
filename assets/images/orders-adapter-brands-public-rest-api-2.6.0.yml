                            longDescription: En breve empezaremos a preparar tu pedido
                            fechaActualizacion: '2021-09-21 22:26:58.58'
                            orden: 1
                            trackingType: SYSTEM
                    rueiData:
                      StoreLangRUEI: <!--itxStoreLang='es'-->
                      StoreTypeRUEI: <!--itxStoreType='VENTA'-->
                      OperationTypeRUEI: <!--itxOperationType='rest-service-impl'-->
                      OperationRUEI: <!--itxOperation='tracking-by-order'-->
                      StoreIdRUEI: <!--itxStoreId='ES'-->
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      operationId: orderTracking
      description: Get information about an order tracking
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/languageId'
        - $ref: '#/components/parameters/appId'
  /itxrest/3/order/store/{storeId}/product/order:
    parameters:
      - $ref: '#/components/parameters/storeId'
    get:
      summary: Get all the products bought by the customer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProducts'
              examples:
                example-1:
                  value:
                    - productId: 2345677
                      skuId: 4938472893
                      orders:
                        - id: 1
                          placeDateUTC: '2019-10-25T12:00:00.000Z'
                          customized: true
        '204':
          description: No Content
          content:
            application/json:
              schema:
                type: array
                items: {}
        '401':
          description: Unauthorized
      security:
        - ItxApiKey: []
      operationId: customerProducts
      description: Get all the products bought by the customer
      tags:
        - products
  /itxrest/3/order/store/{storeId}/product/order/{orderId}:
    parameters:
      - $ref: '#/components/parameters/storeId'
      - $ref: '#/components/parameters/orderId'
    get:
      summary: Get all the products bought in the specified order
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
